<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Calculator</title>
    <link rel="stylesheet" href="BasicCalc.css" />
  </head>
  <body>
    <main class="app" aria-label="Calculator">
      <section class="calculator">
        <div class="display" aria-live="polite" aria-label="Calculator display">
          <div class="expression" id="expression"></div>
          <output class="result" id="result">0</output>
        </div>

        <div class="keys">
          <button class="key key-muted" type="button" data-action="clear"><canvas class="key-surface" aria-hidden="true"></canvas><span class="key-label">AC</span></button>
          <button class="key key-muted" type="button" data-action="delete"><canvas class="key-surface" aria-hidden="true"></canvas><span class="key-label">DEL</span></button>
          <button class="key key-operator" type="button" data-value="**" aria-label="x to the power of y"><canvas class="key-surface" aria-hidden="true"></canvas><span class="key-label">x<sup>y</sup></span></button>
          <button class="key key-operator" type="button" data-value="/"><canvas class="key-surface" aria-hidden="true"></canvas><span class="key-label">&divide;</span></button>

          <button class="key" type="button" data-value="7"><canvas class="key-surface" aria-hidden="true"></canvas><span class="key-label">7</span></button>
          <button class="key" type="button" data-value="8"><canvas class="key-surface" aria-hidden="true"></canvas><span class="key-label">8</span></button>
          <button class="key" type="button" data-value="9"><canvas class="key-surface" aria-hidden="true"></canvas><span class="key-label">9</span></button>
          <button class="key key-operator" type="button" data-value="*"><canvas class="key-surface" aria-hidden="true"></canvas><span class="key-label">&times;</span></button>

          <button class="key" type="button" data-value="4"><canvas class="key-surface" aria-hidden="true"></canvas><span class="key-label">4</span></button>
          <button class="key" type="button" data-value="5"><canvas class="key-surface" aria-hidden="true"></canvas><span class="key-label">5</span></button>
          <button class="key" type="button" data-value="6"><canvas class="key-surface" aria-hidden="true"></canvas><span class="key-label">6</span></button>
          <button class="key key-operator" type="button" data-value="-"><canvas class="key-surface" aria-hidden="true"></canvas><span class="key-label">&minus;</span></button>

          <button class="key" type="button" data-value="1"><canvas class="key-surface" aria-hidden="true"></canvas><span class="key-label">1</span></button>
          <button class="key" type="button" data-value="2"><canvas class="key-surface" aria-hidden="true"></canvas><span class="key-label">2</span></button>
          <button class="key" type="button" data-value="3"><canvas class="key-surface" aria-hidden="true"></canvas><span class="key-label">3</span></button>
          <button class="key key-operator" type="button" data-value="+"><canvas class="key-surface" aria-hidden="true"></canvas><span class="key-label">+</span></button>

          <button class="key key-wide" type="button" data-value="0"><canvas class="key-surface" aria-hidden="true"></canvas><span class="key-label">0</span></button>
          <button class="key key-blank" type="button" aria-hidden="true" tabindex="-1" disabled><canvas class="key-surface" aria-hidden="true"></canvas></button>
          <button class="key key-equals" type="button" data-action="calculate"><canvas class="key-surface" aria-hidden="true"></canvas><span class="key-label">=</span></button>
        </div>
      </section>
    </main>

    <script src="BasicCalc.js"></script>
  </body>
</html>
